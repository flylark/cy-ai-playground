# .github/workflows/tests.yml
# Runs the sensor driver tests automatically on every push and pull request.

name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        working-directory: robotics        # the folder that holds your test files

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v